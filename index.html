<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/src/assets/logo_club_info_250x250.png"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Club Informatique UASZ</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Le Club Informatique de l'UASZ est une communauté d'étudiants passionnés par les technologies, l'innovation et l'informatique au service de la société."
    />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:title" content="Club Informatique UASZ" />
    <meta
      property="og:description"
      content="Découvrez le Club Informatique de l'UASZ : une communauté d'étudiants passionnés par la technologie, l'innovation et l'action sociale."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://club-info-uasz.com" />
    <meta
      property="og:image"
      content="https://club-info-uasz.com/logo_club_info_250x250.png"
    />
    <meta property="og:site_name" content="Club Informatique UASZ" />

    <!-- Twitter Card (utile aussi pour certaines apps) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Club Informatique UASZ" />
    <meta
      name="twitter:description"
      content="Le Club Informatique de l'UASZ rassemble des étudiants passionnés par la technologie et l'innovation."
    />
    <meta
      name="twitter:image"
      content="https://club-info-uasz.com/logo_club_info_250x250.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
